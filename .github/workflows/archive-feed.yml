name: Sync Blog Archive Feed

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/archive_feed.py"
      - "scripts/kit.py"
      - ".github/workflows/archive-feed.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font subsetter
        run: pip install fonttools brotli

      - name: Render latest blog entries
        run: python scripts/archive_feed.py

      - name: Commit feed card
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/archive-feed.svg
          if git commit -m "Sync blog archive feed"; then
            git pull --rebase
            git push
          fi
