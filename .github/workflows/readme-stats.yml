name: Generate README Stats Cards

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&bg_color=0c0d0f&title_color=ffd400&text_color=e8e6e1&icon_color=3fd2e6&ring_color=ffd400&border_color=2a2d33&border_radius=0&rank_icon=github&include_all_commits=true&custom_title=TIM-1E%20%2F%2F%20STATS
          path: assets/github-stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0c0d0f&title_color=ffd400&text_color=e8e6e1&icon_color=3fd2e6&ring_color=ffd400&border_color=2a2d33&border_radius=0&custom_title=TOP%20LANGUAGES
          path: assets/github-stats/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (classic)
        uses: stats-organization/github-readme-stats-action@v2.0.1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&include_all_commits=true&custom_title=Tim-1e%20GitHub%20Stats
          path: assets/github-stats/stats-classic.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (classic)
        uses: stats-organization/github-readme-stats-action@v2.0.1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: assets/github-stats/top-langs-classic.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVG files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/github-stats/*.svg
          if git commit -m "Update README stats cards"; then
            # the three profile workflows can finish together: rebase and retry on a rejected push
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase && git push; then pushed=1; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = 1 ]
          fi
