<svg width="1280" height="500" viewBox="0 0 1280 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="58" y1="58" x2="1222" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12213D"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F3B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(974 116) rotate(123) scale(390 460)">
      <stop stop-color="#22C55E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="92" y1="420" x2="1188" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#243044" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="28" y="28" width="1224" height="444" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="500" fill="#0B0F16"/>
  <rect width="1280" height="500" fill="url(#grid)" opacity="0.82"/>

  <g filter="url(#shadow)">
    <rect x="58" y="58" width="1164" height="384" rx="18" fill="url(#panel)" stroke="#334155"/>
    <rect x="58" y="58" width="1164" height="384" rx="18" fill="url(#glow)"/>
    <rect x="58" y="58" width="1164" height="384" rx="18" stroke="url(#accent)" stroke-opacity="0.32"/>
  </g>

  <text x="110" y="124" fill="#22D3EE" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="850" letter-spacing="1.8">TIM-1E PROFILE PAGE</text>
  <text x="110" y="208" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="74" font-weight="880">Tim_e</text>
  <text x="110" y="264" fill="#E2E8F0" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="800">3D generation / rendering / research tools</text>

  <text x="110" y="316" fill="#CBD5E1" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="22">主线研究 3D 生成与渲染，支线喜欢工具开发、逆向增强和硬件小实验。</text>
  <text x="110" y="354" fill="#94A3B8" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="19">把想法快速做成能跑的小系统，然后继续升级技能树 (｀・ω・´)</text>

  <rect x="110" y="398" width="628" height="2" rx="1" fill="url(#accent)"/>
  <text x="110" y="426" fill="#A7F3D0" font-family="Cascadia Code, Consolas, monospace" font-size="17">render(); build_tools(); automate(); repeat();</text>

  <g opacity="0.96">
    <rect x="808" y="122" width="326" height="94" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="836" y="156" fill="#93C5FD" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="850">MAIN TRACK</text>
    <text x="836" y="188" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="860">3D + Rendering</text>

    <rect x="808" y="244" width="326" height="94" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="836" y="278" fill="#86EFAC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="850">SIDE QUESTS</text>
    <text x="836" y="310" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="860">Tools / Reverse / HW</text>

    <path d="M824 376H1118" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <text x="971" y="412" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="780">research prototypes, tiny tools, and shiny pipelines</text>
