<svg width="1280" height="500" viewBox="0 0 1280 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="58" y1="58" x2="1222" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12213D"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F3B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(974 116) rotate(123) scale(390 460)">
      <stop stop-color="#22C55E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="92" y1="420" x2="1188" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#243044" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="28" y="28" width="1224" height="444" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="500" fill="#0B0F16"/>
  <rect width="1280" height="500" fill="url(#grid)" opacity="0.82"/>

  <g filter="url(#shadow)">
    <rect x="58" y="58" width="1164" height="384" rx="18" fill="url(#panel)" stroke="#334155"/>
    <rect x="58" y="58" width="1164" height="384" rx="18" fill="url(#glow)"/>
    <rect x="58" y="58" width="1164" height="384" rx="18" stroke="url(#accent)" stroke-opacity="0.32"/>
  </g>

  <text x="110" y="124" fill="#22D3EE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="850" letter-spacing="1.4">TIM-1E PROFILE PAGE</text>
  <text x="110" y="210" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="880">Tim_e</text>
  <text x="110" y="268" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">3D generation / rendering / tool-making</text>

  <text x="110" y="318" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">主线是 3D 生成与渲染，也喜欢把工具开发、逆向增强、硬件小实验串成自己的装备库。</text>
  <text x="110" y="355" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">目标是成为全栈能力拉满的图形研究员。今天也在升级技能树中 (｀・ω・´)</text>

  <rect x="110" y="397" width="670" height="2" rx="1" fill="url(#accent)"/>

  <g opacity="0.96">
    <rect x="812" y="118" width="304" height="70" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="838" y="148" fill="#93C5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="850">MAIN TRACK</text>
    <text x="838" y="175" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="860">3D + Rendering</text>

    <rect x="812" y="211" width="304" height="70" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="838" y="241" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="850">SIDE QUESTS</text>
    <text x="838" y="268" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="860">Tools / Reverse / HW</text>

    <rect x="812" y="304" width="304" height="70" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="838" y="334" fill="#FDE68A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="850">PUBLIC REPOS</text>
    <text x="838" y="361" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="860">22 modules</text>
  </g>
</svg>
